name: Build downloads

# Builds the ready-to-run zips (Class Quest + Node.js, nothing to install).
# Run it from the Actions tab, or push a tag like v1.2.0 to also publish a
# release with the zips attached.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test
        run: node --test test/*.test.js
      - name: Package
        run: node scripts/package.js
      - uses: actions/upload-artifact@v4
        with:
          name: class-quest-downloads
          path: dist/*.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "Class Quest $GITHUB_REF_NAME" \
            --notes "Download the zip for your computer (win-x64 for Windows, mac-arm64 for Apple-chip Macs, mac-x64 for older Intel Macs), unzip it, and open START HERE.txt."
