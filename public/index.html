<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Class Quest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="title-wrap">
      <h1 id="title">Class Quest</h1>
      <select id="viewPicker" class="view-picker" aria-label="Screen" hidden></select>
    </div>
    <div id="goal" class="goal" role="img" hidden>
      <span class="goal-label">Class goal</span>
      <span class="goal-bar"><span id="goalFill"></span></span>
      <span id="goalText" class="goal-text"></span>
    </div>
    <div class="meta">
      <span id="mode" class="badge"></span>
      <span id="updated" class="updated"></span>
      <button id="soundToggle" class="btn" aria-pressed="false" title="Sound effects">♪ Off</button>
      <button id="spotToggle" class="btn" aria-pressed="false" title="Automatically show each student's level in turn">Spotlight</button>
      <button id="boardToggle" class="btn" aria-pressed="true">Board</button>
      <button id="fullscreen" class="btn" title="Full screen">⛶</button>
    </div>
  </header>
  <div id="error" class="error" role="status" hidden></div>

  <main class="layout" id="layout">
    <section class="track-wrap" id="trackWrap" aria-label="Class race. Select a lane or a leaderboard row to see that student's level.">
      <canvas id="track"></canvas>
      <p id="empty" class="empty" hidden></p>
    </section>
    <aside class="board" aria-labelledby="boardTitle">
      <h2 id="boardTitle">Leaderboard</h2>
      <ol id="board" class="board-list"></ol>
    </aside>
  </main>

  <footer class="ticker" id="tickerBar">
    <span class="ticker-label">News</span>
    <ul id="ticker" class="ticker-list" aria-live="polite"></ul>
    <a href="#" id="galleryLink" class="footer-link">Characters</a>
    <a href="/admin" class="footer-link">Teacher</a>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <dialog id="detail" class="dialog" aria-labelledby="dName">
    <button class="close" data-close aria-label="Close">✕</button>
    <div class="detail-head">
      <img id="dSprite" class="d-sprite" alt="">
      <div>
        <p class="spot-tag">Spotlight</p>
        <h2 id="dName"></h2>
        <p id="dSub" class="sub"></p>
      </div>
    </div>
    <p id="dHighlights" class="highlights" hidden></p>
    <div class="scene-wrap"><canvas id="scene" class="scene"></canvas></div>
    <div class="detail-grid">
      <section>
        <h3 id="dLevelTitle"></h3>
        <ol id="dItems" class="items"></ol>
        <div id="dBadgesWrap" hidden>
          <h3 class="badges-title">Badges</h3>
          <ul id="dBadges" class="badge-list"></ul>
        </div>
      </section>
      <section>
        <h3>Journey</h3>
        <ol id="dLevels" class="journey"></ol>
      </section>
    </div>
  </dialog>

  <dialog id="gallery" class="dialog" aria-labelledby="gTitle">
    <button class="close" data-close aria-label="Close">✕</button>
    <h2 id="gTitle">Characters</h2>
    <p class="sub">Characters are assigned automatically. Your teacher can pick a different one for you in Teacher controls.</p>
    <div id="galleryGrid" class="gallery"></div>
  </dialog>

  <script src="sprites.js"></script>
  <script src="worlds.js"></script>
  <script src="app.js"></script>
</body>
</html>
