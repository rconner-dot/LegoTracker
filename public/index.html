<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Class Quest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1 id="title">Class Quest</h1>
    <div class="meta">
      <span id="mode" class="badge"></span>
      <span id="updated" class="updated"></span>
      <button id="boardToggle" class="btn" aria-pressed="true">Board</button>
    </div>
  </header>
  <div id="error" class="error" role="status" hidden></div>

  <main class="layout" id="layout">
    <section class="track-wrap" id="trackWrap" aria-label="Class race. Select a lane or a leaderboard row to see that student's level.">
      <canvas id="track"></canvas>
      <p id="empty" class="empty" hidden></p>
    </section>
    <aside class="board" aria-labelledby="boardTitle">
      <h2 id="boardTitle">Leaderboard</h2>
      <ol id="board" class="board-list"></ol>
    </aside>
  </main>

  <footer class="ticker" id="tickerBar">
    <span class="ticker-label">News</span>
    <ul id="ticker" class="ticker-list" aria-live="polite"></ul>
    <a href="#" id="galleryLink" class="gallery-link">Characters</a>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <dialog id="detail" class="dialog" aria-labelledby="dName">
    <button class="close" data-close aria-label="Close">✕</button>
    <div class="detail-head">
      <img id="dSprite" class="d-sprite" alt="">
      <div>
        <h2 id="dName"></h2>
        <p id="dSub" class="sub"></p>
      </div>
    </div>
    <canvas id="scene" class="scene"></canvas>
    <div class="detail-grid">
      <section>
        <h3 id="dLevelTitle"></h3>
        <ol id="dItems" class="items"></ol>
      </section>
      <section>
        <h3>Journey</h3>
        <ol id="dLevels" class="journey"></ol>
      </section>
    </div>
  </dialog>

  <dialog id="gallery" class="dialog" aria-labelledby="gTitle">
    <button class="close" data-close aria-label="Close">✕</button>
    <h2 id="gTitle">Characters</h2>
    <p class="sub">Characters are assigned automatically. To pick one for a student, add it to <code>characters</code> in <code>config.json</code>, e.g. <code>"12345": "robot-3"</code>.</p>
    <div id="galleryGrid" class="gallery"></div>
  </dialog>

  <script src="sprites.js"></script>
  <script src="worlds.js"></script>
  <script src="app.js"></script>
</body>
</html>
