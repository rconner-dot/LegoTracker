name: Build downloads

# Builds the ready-to-run zips (Class Quest + Node.js, nothing to install) and
# publishes them as a GitHub release.
#
# To make a release, change the number in the VERSION file and push. Pushing
# a v* tag or running this from the Actions tab works too.
on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['v*']
    paths: ['VERSION']   # branch pushes only build when VERSION changes

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test
        run: node --test test/*.test.js
      - name: Package
        run: node scripts/package.js
      - uses: actions/upload-artifact@v4
        with:
          name: class-quest-downloads
          path: dist/*.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$(tr -d '[:space:]' < VERSION)"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; updating its downloads."
            gh release upload "$TAG" dist/*.zip --clobber
          else
            gh release create "$TAG" dist/*.zip --target "$GITHUB_SHA" \
              --title "Class Quest $TAG" --notes-file .github/release-notes.md
          fi
